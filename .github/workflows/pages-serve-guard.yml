name: pages-serve-guard

on:
  workflow_run:
    workflows: ["pages"]
    types: [completed]

jobs:
  assert_serving:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert Pages URL serves verifier UI
        shell: bash
        run: |
          set -euo pipefail
          URL="https://verifrax.github.io/VERIFRAX-verify/"
          curl -fsSL "$URL" | grep -q "verifrax.proof.v1"
          curl -fsSL "$URL" | grep -q "<title>Verifrax Verifier</title>"
          echo "OK: serving"
