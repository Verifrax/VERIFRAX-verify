name: pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dist
        run: |
          set -euo pipefail
          npm run build

      - name: Bind verifier hostname
        shell: bash
        run: |
          set -euo pipefail
          test -f public/CNAME
          grep -Fx "verify.verifrax.net" public/CNAME
          cp public/CNAME dist/CNAME
          test -f dist/index.html
          grep -q "<title>Verifrax Verifier</title>" dist/index.html

      - name: Publish static verifier routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/check dist/spec
          test -f public/check/index.html
          test -f public/spec/index.html
          cp public/check/index.html dist/check/index.html
          cp public/spec/index.html dist/spec/index.html
          test -f dist/check/index.html
          test -f dist/spec/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
